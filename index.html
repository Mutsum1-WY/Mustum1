<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rain Pages · 个人文章存储：本地保存、搜索与阅读你的文章。" />
  <title>Rain Pages</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23bfdbfe'/%3E%3Cstop offset='1' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg fill='url(%23g)'%3E%3Cpath d='M50 4C34 24 18 42 18 62a32 32 0 0 0 64 0C82 42 66 24 50 4z' transform='translate(7 13) scale(.62)'/%3E%3Cpath d='M50 4C34 24 18 42 18 62a32 32 0 0 0 64 0C82 42 66 24 50 4z' transform='translate(56 55) scale(.42)'/%3E%3Cpath d='M50 4C34 24 18 42 18 62a32 32 0 0 0 64 0C82 42 66 24 50 4z' transform='translate(68 18) scale(.26)'/%3E%3C/g%3E%3Cellipse cx='30' cy='46' rx='4.5' ry='7' fill='%23ffffff' opacity='0.35'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="topbar-fixed">

  <!-- 顶栏 -->
  <header class="topbar">
    <button class="brand" id="homeBtn" title="回到文章列表">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">Rain Pages</span>
      <span class="brand-sub">PERSONAL ARCHIVE</span>
    </button>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="search" placeholder="搜索标题、正文、标签…" autocomplete="off" aria-label="搜索文章" />
    </div>

    <!-- 友链 -->
    <div class="links-wrap" id="linksWrap">
      <button class="links-btn" id="linksBtn" type="button" aria-haspopup="true" aria-expanded="false" title="友链">
        <svg class="links-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span>友链</span>
      </button>
      <div class="links-panel" id="linksPanel" hidden>
        <div class="links-head">
          <span>友链</span>
          <span class="links-count" id="linksCount"></span>
        </div>
        <div class="links-list" id="linksList"></div>
        <p class="links-note">时间是不会停下来的，我们只好走下去了。</p>
      </div>
    </div>
  </header>

  <div class="layout">

    <!-- 主区域 -->
    <main class="main">

      <!-- 列表视图 -->
      <section class="view" id="viewList" aria-label="文章列表">

        <!-- 首页顶部展示区（背景图在 styles.css 的 --hero-img 处更换；整页显示，向下滚动自动收缩） -->
        <div class="hero-wrap" id="heroWrap">
          <section class="hero" aria-label="首页展示">
            <div class="hero-inner">
              <div class="hero-eyebrow">MUTSUM1 · PERSONAL ARCHIVE</div>
              <div class="hero-title-row">
                <h1 class="hero-title">Mutsum<em>1</em></h1>
                <a class="hero-avatar" href="https://github.com/Mutsum1-WY" target="_blank" rel="noopener noreferrer" title="GitHub · Mutsum1-WY">
                  <img src="https://github.com/Mutsum1-WY.png" alt="Mutsum1-WY 的头像" width="56" height="56" onerror="this.closest('.hero-avatar').style.display='none'" />
                </a>
              </div>
              <p class="hero-sub" id="heroSub">伤不是要你去忍耐的东西，痛是要说出来的。</p>
              <div class="hero-actions">
                <button class="btn hero-ghost" id="heroBrowseBtn" type="button">浏览全部文章 ↓</button>
              </div>
            </div>
          </section>
        </div>

        <div class="list-head">
          <h1 id="listTitle">全部文章</h1>
          <div class="list-head-right">
            <span class="list-count" id="listCount"></span>
            <label class="sort-select">排序
              <select id="sortSelect" aria-label="文章排序">
                <option value="updated">最近更新</option>
                <option value="created">最新创建</option>
                <option value="oldest">最早创建</option>
                <option value="title">按标题</option>
              </select>
            </label>
          </div>
        </div>
        <div class="article-grid" id="articleGrid"></div>

        <!-- 空状态 -->
        <div class="empty-state" id="emptyState" hidden>
          <div class="empty-icon" aria-hidden="true">📄</div>
          <h2 id="emptyTitle">还没有任何文章</h2>
          <p id="emptyText"></p>
          <button class="btn ghost" id="clearFilterBtn" type="button" hidden>清除筛选</button>
        </div>

        <!-- 主页底部区块 -->
        <footer class="home-footer">
          <div class="footer-inner">
            <div class="footer-brand">
              <span class="brand-dot" aria-hidden="true"></span>
              <span>Rain Pages</span>
              <span class="footer-sub">PERSONAL ARCHIVE</span>
            </div>
            <p class="footer-desc">For wish, for blessing</p>
            <button class="footer-top" id="footerTopBtn" type="button">回到顶部 ↑</button>
          </div>
        </footer>
      </section>

      <!-- 阅读视图 -->
      <section class="view" id="viewReader" aria-label="文章阅读" hidden>
        <div class="reader-head">
          <button class="btn ghost" id="backBtn" type="button">← 返回列表</button>
        </div>
        <article class="reader" id="reader">
          <header class="reader-header">
            <div class="reader-meta">
              <span class="chip" id="readerCategory"></span>
              <span id="readerDate"></span>
              <span id="readerWords"></span>
            </div>
            <h1 id="readerTitle"></h1>
            <div class="tag-row" id="readerTags"></div>
          </header>
          <div class="markdown-body" id="readerContent"></div>
          <footer class="reader-footer" id="readerFooter"></footer>
        </article>
      </section>

    </main>
  </div>

  <noscript><p style="padding:24px;text-align:center">Rain Pages 需要启用 JavaScript 才能运行。</p></noscript>
  <script src="script.js"></script>
</body>
</html>
