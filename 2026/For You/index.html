<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --ink: #0f1b2d;
      --muted: #64748b;
      --faint: #9aa7b8;
      --line: #e5eaf2;
      --accent: #1e3a8a;
      --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --serif: Georgia, "Noto Serif SC", "Songti SC", "STSong", SimSun, serif;
      --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }

    .topbar {
      flex: none;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      font-weight: 700;
      font-size: 17px;
    }
    .brand-dot { width: 12px; height: 12px; border-radius: 3px; background: var(--accent); }
    .brand-sub {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .22em;
      color: var(--muted);
      margin-top: 3px;
    }
    .back-link {
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--muted);
      text-decoration: none;
    }
    .back-link:hover { color: var(--accent); }

    /* 内容区占满剩余可视高度，卡片垂直居中 */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    article {
      width: 100%;
      max-width: 920px;
      padding: 76px 84px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    .meta {
      font-family: var(--mono);
      font-size: 13.5px;
      color: var(--muted);
      letter-spacing: .06em;
    }
    h1 {
      margin: 20px 0 40px;
      font-family: var(--serif);
      font-size: 56px;
      line-height: 1.25;
    }
    .body {
      font-family: var(--serif);
      font-size: 20px;
      line-height: 2;
      color: var(--muted);
    }

    /* 页脚固定在可视区域底部 */
    footer {
      flex: none;
      width: 100%;
      padding: 20px 24px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--muted);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      article { padding: 32px 22px; }
      h1 { font-size: 34px; }
      .body { font-size: 17px; }
      footer { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../../index.html">
      <span class="brand-dot"></span>
      <span>Rain Pages</span>
      <span class="brand-sub">PERSONAL ARCHIVE</span>
    </a>
    <a class="back-link" href="../../index.html">← 返回文章库</a>
  </header>

  <main>
    <article>
      <div class="meta">2026-08-26 · RAIN PAGES ARCHIVE</div>
      <h1>For You</h1>
      <div class="body">如你所见，这是一个类似博客的网站。起因是小资历喜欢显摆，所以心血来潮做了这个网站，它的作用就是充当个人博客，同时写一些杂乱无章的东西进来，后续可能会有其他内容更新，谁知道呢。也许4年后这个网站会变成现在我所不认识的样子吧。<br>时间是不会停下来的，我们只好走下去了。</div>
    </article>
  </main>

  <footer>
    <span>For wish, for blessing</span>
    <a href="../../index.html">回到文章库 ↑</a>
  </footer>
</body>
</html>
