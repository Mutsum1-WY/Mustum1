<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="For You · 风文库个人文章" />
  <title>For You · 风文库</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231e7a5a'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23f5f4ef' font-family='serif' font-weight='bold'%3E风%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f5f4ef;
      --panel: #fffdf9;
      --ink: #26241f;
      --muted: #8b867a;
      --faint: #b5b0a4;
      --line: #e3e0d5;
      --accent: #1e7a5a;
      --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --serif: Georgia, "Noto Serif SC", "Songti SC", "STSong", SimSun, serif;
      --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }

    .topbar {
      flex: none;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      font-weight: 700;
      font-size: 17px;
    }
    .brand-dot { width: 12px; height: 12px; border-radius: 3px; background: var(--accent); }
    .brand-sub {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .22em;
      color: var(--muted);
      margin-top: 3px;
    }
    .back-link {
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--muted);
      text-decoration: none;
    }
    .back-link:hover { color: var(--accent); }

    /* 内容区占满剩余可视高度，卡片垂直居中 */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    article {
      width: 100%;
      max-width: 920px;
      padding: 76px 84px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    .meta {
      font-family: var(--mono);
      font-size: 13.5px;
      color: var(--muted);
      letter-spacing: .06em;
    }
    h1 {
      margin: 20px 0 40px;
      font-family: var(--serif);
      font-size: 56px;
      line-height: 1.25;
    }
    .body {
      font-family: var(--serif);
      font-size: 20px;
      line-height: 2;
      color: var(--muted);
    }

    /* 页脚固定在可视区域底部 */
    footer {
      flex: none;
      width: 100%;
      padding: 20px 24px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--muted);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      article { padding: 32px 22px; }
      h1 { font-size: 34px; }
      .body { font-size: 17px; }
      footer { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../../index.html">
      <span class="brand-dot"></span>
      <span>风文库</span>
      <span class="brand-sub">WIND PAGES</span>
    </a>
    <a class="back-link" href="../../index.html">← 返回文章库</a>
  </header>

  <main>
    <article>
      <div class="meta">2026-08-26 · WIND PAGES ARCHIVE</div>
      <h1>For You</h1>
      <div class="body">正文待补充…</div>
    </article>
  </main>

  <footer>
    <span>For wish, for blessing</span>
    <a href="../../index.html">回到文章库 ↑</a>
  </footer>
</body>
</html>
